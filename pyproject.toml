[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-scratchpad-branching-tree"
version = "0.1.0"
description = "Tree-of-Thought (ToT) reasoning scratchpad that manages parallel exploration branches with heuristic evaluation and backtracking"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-scratchpad-branching-tree = "agent_scratchpad_branching_tree.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_scratchpad_branching_tree*"]
